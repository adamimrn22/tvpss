
<div
	th:replace="~{fragments/breadcrumbs :: breadcrumb(title1=${breadcrumbTitle1}, title2=${breadcrumbTitle2})}">
</div>

<div th:if="${success}" class="alert alert-success" role="alert">
	<span th:text="${success}"></span>
</div>

<div th:if="${error}" class="alert alert-danger" role="alert">
	<span th:text="${error}"></span>
</div>


<div class="card p-3">
	<h3 style="color: var(--primary)" th:text="#{adminppd.view.schoolInfo.title}">Maklumat Sekolah</h3>
	<div class="d-flex justify-content-between align-items-end mb-3">
		<div>
			<!-- Set the width here -->
			<div class="floating-form-group" style="width: 400px">
				<input id="searchSchool" type="text" class="floating-input" placeholder=" ">
				<label class="floating-input-label" th:text="#{adminppd.view.searchPlaceholder}">Cari Nama Sekolah...</label>
			</div>
		</div>
		<div class="d-flex align-items-center">
			<div class="d-flex align-items-center mx-4">
				<label for="entries" class="mx-3" th:text="#{adminppd.view.show}">Tunjuk</label>
				<select id="entries" class="form-select w-auto me-2">
					<option selected>5</option>
					<option>10</option>
					<option>25</option>
					<option>50</option>
					<option>100</option>
				</select>
				<span th:text="#{adminppd.view.entries}">Entri</span>
			</div>

			<div class="dropdown mx-2">
				<button class="btn btn-outline-secondary btn-sm dropdown-toggle"
						type="button" id="versiDropdown" data-bs-toggle="dropdown"
						aria-expanded="false">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
						 viewBox="0 0 24 24" fill="none" stroke="currentColor"
						 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
						 class="icon icon-tabler icons-tabler-outline icon-tabler-filter">
						<path stroke="none" d="M0 0h24v24H0z" fill="none" />
						<path
								d="M4 4h16v2.172a2 2 0 0 1 -.586 1.414l-4.414 4.414v7l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227z" />
					</svg>
					<span th:text="#{stateadmin.schoolInfo.version}">Versi</span>
				</button>
				<ul class="dropdown-menu" aria-labelledby="versiDropdown">
					<li><a class="dropdown-item" href="#">Semua Versi</a></li>
					<li><a class="dropdown-item" href="#">N/A</a></li>
					<li><a class="dropdown-item" href="#">0</a></li>
					<li><a class="dropdown-item" href="#">1</a></li>
					<li><a class="dropdown-item" href="#">2</a></li>
					<li><a class="dropdown-item" href="#">3</a></li>
					<li><a class="dropdown-item" href="#">4</a></li>
				</ul>
			</div>

			<button class="btn btn-outline-danger btn-sm">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
					 viewBox="0 0 24 24" fill="none" stroke="currentColor"
					 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
					 class="icon icon-tabler icons-tabler-outline icon-tabler-file-type-pdf">
					<path stroke="none" d="M0 0h24v24H0z" fill="none" />
					<path d="M14 3v4a1 1 0 0 0 1 1h4" />
					<path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4" />
					<path d="M5 18h1.5a1.5 1.5 0 0 0 0 -3h-1.5v6" />
					<path d="M17 18h2" />
					<path d="M20 15h-3v6" />
					<path d="M11 15v6h1a2 2 0 0 0 2 -2v-2a2 2 0 0 0 -2 -2h-1z" />
				</svg>
				<span class="mx-1" th:text="#{adminppd.view.exportPDF}">Eksport PDF</span>
			</button>
			<button class="btn btn-outline-success btn-sm ms-2">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
					 viewBox="0 0 24 24" fill="none" stroke="currentColor"
					 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
					 class="icon icon-tabler icons-tabler-outline icon-tabler-file-type-xls">
					<path stroke="none" d="M0 0h24v24H0z" fill="none" />
					<path d="M14 3v4a1 1 0 0 0 1 1h4" />
					<path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4" />
					<path d="M4 15l4 6" />
					<path d="M4 21l4 -6" />
					<path
							d="M17 20.25c0 .414 .336 .75 .75 .75h1.25a1 1 0 0 0 1 -1v-1a1 1 0 0 0 -1 -1h-1a1 1 0 0 1 -1 -1v-1a1 1 0 0 1 1 -1h1.25a.75 .75 0 0 1 .75 .75" />
					<path d="M11 15v6h3" />
				</svg>
				<span class="mx-1" th:text="#{adminppd.view.exportExcel}">Eksport Excel</span>
			</button>
		</div>
	</div>

	<table class="table table-school">
		<thead>
		<tr>
			<th th:text="#{adminppd.view.schoolCode}">Kod Sekolah</th>
			<th th:text="#{adminppd.view.schoolName}">Nama Sekolah</th>
			<th th:text="#{adminppd.view.schoolOfficer}">Nama Pengawai Sekolah</th>
			<th class="text-center" th:text="#{adminppd.view.version}">Versi</th>
			<th class="text-center" th:text="#{adminppd.view.status}">Status</th>
			<th class="text-center" th:text="#{adminppd.view.actions}">Aksi</th>
		</tr>
		</thead>
		<tbody>
		<tr class="text-first" th:each="data : ${schoolDataList}">
			<td th:text="${data['school'].code}">JEA9012</td>
			<td th:text="${data['school'].name}">SJK (C) Kuo Kuang 2</td>
			<td th:text="${data['version'] != null && data['version'].pic != null ? data['version'].pic.name : 'N/A'}">N/A</td>
			<td class="text-center" th:text="${data['version'] != null ? data['version'].tvpssVersion : 'N/A'}">3</td>
			<td class="text-center" th:text="${data['version'] != null && data['version'].tvpssCurrentStatus != null ? data['version'].tvpssCurrentStatus : 'BELUM SUBMIT'}">
				BELUM SUBMIT
			</td>
			<td class="text-center">
				<a class="btn btn-primary btn-sm" th:href="@{/InformasiTVPSS/SchoolValidate/{schoolCode}(schoolCode=${data['school'].code})}">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
						 viewBox="0 0 24 24" fill="currentColor"
						 class="icon icon-tabler icons-tabler-filled icon-tabler-copy-check">
						<path stroke="none" d="M0 0h24v24H0z" fill="none" />
						<path
								d="M18.333 6a3.667 3.667 0 0 1 3.667 3.667v8.666a3.667 3.667 0 0 1 -3.667 3.667h-8.666a3.667 3.667 0 0 1 -3.667 -3.667v-8.666a3.667 3.667 0 0 1 3.667 -3.667zm-3.333 -4c1.094 0 1.828 .533 2.374 1.514a1 1 0 1 1 -1.748 .972c-.221 -.398 -.342 -.486 -.626 -.486h-10c-.548 0 -1 .452 -1 1v9.998c0 .32 .154 .618 .407 .805l.1 .065a1 1 0 1 1 -.99 1.738a3 3 0 0 1 -1.517 -2.606v-10c0 -1.652 1.348 -3 3 -3zm1.293 9.293l-3.293 3.292l-1.293 -1.292a1 1 0 0 0 -1.414 1.414l2 2a1 1 0 0 0 1.414 0l4 -4a1 1 0 0 0 -1.414 -1.414" />
					</svg>
					<span class="mx-1" th:text="#{adminppd.view.validation}">Validasi</span>
				</a>
			</td>
		</tr>
		</tbody>
	</table>


	<ul class="pagination justify-content-start m-3">
		<li class="page-item"><a class="page-link" href="#"
								 aria-label="Previous" >
			<span aria-hidden="true">&laquo;</span>
		</a></li>
		<li class="page-item active"><a class="page-link" href="#">1</a>
		</li>
		<li class="page-item"><a class="page-link" href="#"
								 aria-label="Next">
			<span aria-hidden="true">&raquo;</span>
		</a></li>
	</ul>
</div>

<script th:src="@{/js/PPDAdmin/viewPPDSchoolTableFilter.js}"></script>
<script>
	document.addEventListener('DOMContentLoaded', () => {
		const tableManager = new TableManager('.table-school');
	});
</script>
