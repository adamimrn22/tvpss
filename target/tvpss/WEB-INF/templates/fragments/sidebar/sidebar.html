<div th:fragment="sidebar" id="sidebar" class="d-flex flex-column">
	<img th:src="@{/images/LogoTVPSS.svg}" alt="TVPSS Logo">


	<nav class="nav flex-column">
		<div th:switch="${role}">
			<div th:case="'superadmin'"
				th:include="fragments/sidebar/superadmin-sidebar :: superadmin-sidebar"></div>

			<div th:case="'stateadmin'"
				th:include="fragments/sidebar/stateadmin-sidebar :: stateadmin-sidebar"></div>

			<div th:case="'ppdadmin'"
				th:include="fragments/sidebar/ppdadmin-sidebar :: ppdadmin-sidebar"></div>

			<div th:case="'schooladmin'"
				th:include="fragments/sidebar/schooladmin-sidebar :: schooladmin-sidebar"></div>
		</div>
	</nav>

	<div class="mt-auto">
		<a th:href="@{/resetpassword}"
			th:classappend="${currentPageDirectory == 'resetpassword' ? ' active pe-none' : ''}"
			class="nav-link px-3 mx-3 mt-2"> <i class="bi bi-gear"></i>
			Tetapan
		</a>

		<form id="logout-form" th:action="@{/logout}" method="post"
			style="display: inline;">
			<a class="nav-link px-3 mx-3 mt-2" href="javascript:void(0);"
				onclick="document.getElementById('logout-form').submit();"> <input
				type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
				<button type="submit"
					style="background: none; border: none; color: inherit; text-decoration: none; font-size: inherit; padding: 0; cursor: pointer;">
					<i class="bi bi-box-arrow-right"></i> Log Keluar
				</button>
			</a>
		</form>



	</div>
</div>
