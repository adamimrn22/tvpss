<div th:fragment="header" id="header" xmlns:th="http://www.thymeleaf.org">
	<div class="user-info">

		<!-- User -->
		<div class="user-icon text-uppercase" th:text="${#strings.substring(currentUser.name, 0, 1) + (#strings.contains(currentUser.name, ' ') ? #strings.substring(#strings.substringAfter(currentUser.name, ' '), 0, 1) : #strings.substring(currentUser.name, 1, 2))}">JD</div>
		<div class="d-flex flex-column">
			<span  th:text="${currentUser.getName()}">Adam Doe</span> <span class="role-text"  th:text="${currentUser.getRole().name}">Super
				Admin</span>
		</div>

		<div class="dropdown">
			<a class="btn dropdown-toggle language-style" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
				<span th:text="${#locale}"></span>
			</a>
			<ul class="dropdown-menu">
				<li>
					<form th:action="@{/change-language}" method="post" style="display: inline;">
						<input type="hidden" name="lang" value="ms">
						<button type="submit" class="dropdown-item">ms</button>
					</form>
				</li>
				<li>
					<form th:action="@{/change-language}" method="post" style="display: inline;">
						<input type="hidden" name="lang" value="en">
						<button type="submit" class="dropdown-item">en</button>
					</form>
				</li>
			</ul>
		</div>


	</div>
</div>
