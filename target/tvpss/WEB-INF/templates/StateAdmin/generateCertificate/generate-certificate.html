<div class="p-3">
	<!-- Main Form -->
	<div class="card">
		<div class="card-body">
			<a class="btn btn-success btn-sm" th:href="@{/GenerateCertificate}">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
					viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
					class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left">
					<path stroke="none" d="M0 0h24v24H0z" fill="none" />
					<path d="M5 12l14 0" />
					<path d="M5 12l6 6" />
					<path d="M5 12l6 -6" /></svg> <span class="mx-1"
				th:text="#{stateadmin.generatecert.button.back}">Kembali</span>
			</a>

			<h5 class="my-3" th:text="#{stateadmin.generatecert.generate.title}">
				Senarai Pelajar</h5>
			<table class="table" id="selectedStudentsTable">
				<thead>
				<tr>
					<th style="width: 10%" th:text="#{stateadmin.generatecert.viewdetails.table.header.id}">ID</th>
					<th style="width: 20%" th:text="#{stateadmin.generatecert.viewdetails.table.header.name}">Nama</th>
					<th style="width: 15%" th:text="#{stateadmin.generatecert.viewdetails.table.header.date}">Tarikh</th>
					<th style="width: 20%" th:text="#{stateadmin.generatecert.viewdetails.table.header.achievement_type}">Jenis Pencapaian</th>
					<th style="width: 25%" th:text="#{stateadmin.generatecert.viewdetails.table.header.achievement_info}">Maklumat Pencapaian</th>
				</tr>
				</thead>
				<tbody>
				<!-- Iterate through the list of StudentAchievement objects -->
				<tr th:each="achievement : ${studentAchievements}">
					<td style="width: 10%" th:text="${achievement.studentIdentificationNumber}">012100</td>
					<td style="width: 20%" th:text="${achievement.studentName}">ABU</td>
					<td style="width: 15%" th:text="${#dates.format(achievement.studentDateAchievement, 'dd/MM/yyyy')}">22/2/2024</td>
					<td style="width: 20%" th:text="${achievement.studentTypeAchievement}">Sukan</td>
					<td style="width: 25%" th:text="${achievement.achievementInformation}">Menang</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>

	<form id="certificateForm" action="/your-endpoint" method="post" enctype="multipart/form-data">
		<div class="col-12">
			<div class="floating-form-group">
				<input type="file" class="floating-input" id="logo" placeholder=" " name="logo">
				<label class="floating-input-label" th:text="#{schooladmin.schooltvpss.uploadLogo}"></label>
			</div>
		</div>
		<!-- Hidden input to pass the school email -->
		<input type="text" name="schoolEmail" th:value="${schoolData['version'].pic.emailAddress}">
		<button type="submit">Submit</button>
	</form>


</div>
