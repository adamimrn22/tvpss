<div class="p-3">
	<!-- Main Form -->
	<div class="card">
		<div class="card-body">
			<a class="btn btn-success btn-sm" th:href="@{/GenerateCertificate}">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
					viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
					class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left">
					<path stroke="none" d="M0 0h24v24H0z" fill="none" />
					<path d="M5 12l14 0" />
					<path d="M5 12l6 6" />
					<path d="M5 12l6 -6" /></svg> <span class="mx-1"
				th:text="#{stateadmin.generatecert.button.back}">Kembali</span>
			</a>

			<h5 class="my-3" th:text="#{stateadmin.generatecert.generate.title}">
				Senarai Pelajar</h5>
			<table class="table" id="selectedStudentsTable">
				<thead>
					<tr>
						<th style="width: 10%"
							th:text="#{stateadmin.generatecert.generate.table.header.id}">
							ID</th>
						<th style="width: 20%"
							th:text="#{stateadmin.generatecert.generate.table.header.name}">
							Nama</th>
						<th style="width: 15%"
							th:text="#{stateadmin.generatecert.generate.table.header.date}">
							Tarikh</th>
						<th style="width: 20%"
							th:text="#{stateadmin.generatecert.generate.table.header.achievement_type}">
							Jenis Pencapaian</th>
						<th style="width: 25%"
							th:text="#{stateadmin.generatecert.generate.table.header.achievement_info}">
							Maklumat Pencapaian</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td style="width: 10%">012100</td>
						<td style="width: 20%">ABU</td>
						<td style="width: 15%">22/2/2024</td>
						<td style="width: 20%">Sukan</td>
						<td style="width: 25%">Menang</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

	<form id="certificateForm">
		<div class="mb-3">
			<div id="imagePreview" class="mb-2">
				<!-- Preview will be shown here -->
			</div>
			<button type="button" class="btn btn-success" data-bs-toggle="modal"
				data-bs-target="#imageModal"
				th:text="#{stateadmin.generatecert.generate.choose_certificate}">
				Pilih Sijil</button>
		</div>

		<button type="submit" class="btn btn-primary text-end"
			th:text="#{stateadmin.generatecert.generate.generate_certificate}">
			Jana Sijil</button>

		<a class="btn btn-sm" th:href="@{/GenerateCertificate}"> <svg
				xmlns="http://www.w3.org/2000/svg" width="24" height="24"
				viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
				class="icon icon-tabler icons-tabler-outline icon-tabler-cancel">
				<path stroke="none" d="M0 0h24v24H0z" fill="none" />
				<path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
				<path d="M18.364 5.636l-12.728 12.728" /></svg> <span class="mx-1"
			th:text="#{stateadmin.generatecert.button.revert}">Batal</span>
		</a>
	</form>

	<!-- Modal -->
	<div class="modal fade" id="imageModal" tabindex="-1">
		<div class="modal-dialog modal-xl">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title"
						th:text="#{stateadmin.generatecert.generate.select_certificate_template}">
						Pilih Template Sijil</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<p class="text-muted text-center mb-3">Click on a template to
						select it</p>
					<div class="row">
						<!-- Template Images -->
						<!-- Same as previous for each template -->
						<!-- Example for Template 1 -->
						<div class="col-md-4">
							<div class="certificate-image-container">
								<img src="https://picsum.photos/seed/cert1/800/500"
									class="certificate-image" alt="Certificate Template 1"
									data-template-id="1">
								<div class="selection-overlay">Selected</div>
							</div>
						</div>
						<!-- Repeat for other templates -->
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal"
						th:text="#{stateadmin.generatecert.generate.close}">
						Tutup</button>
					<button type="button" class="btn btn-primary" id="addButton"
						disabled th:text="#{stateadmin.generatecert.generate.add}">
						Tambah</button>
				</div>
			</div>
		</div>
	</div>

</div>
