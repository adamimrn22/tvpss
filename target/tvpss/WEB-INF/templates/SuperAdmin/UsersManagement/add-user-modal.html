<!-- Add User Modal -->
<div th:fragment="addUserModal">
	<div class="modal fade" id="addUserModal" tabindex="-1"
		 aria-labelledby="addUserModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">


			<div class="modal-content">
				<form th:action="@{/SuperAdmin/Pengguna/addUser}" method="post">
					<input	type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
					<div class="modal-header">
						<h5 class="modal-title" id="addUserModalLabel"
							style="color: #515B92" th:text="#{user.addUserModal.title}"></h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="#{user.addUserModal.closeButton}"></button>
					</div>

					<div class="modal-body">
							<div class="p-3 pt-0">
								<div>
									<!-- Set the width here -->
									<div class="floating-form-group">
										<input type="text" class="floating-input" placeholder=" " name="fullName">
										<label class="floating-input-label" th:text="#{user.addUserModal.fullNameLabel}"></label>
									</div>
								</div>
								<div>
									<!-- Set the width here -->
									<div class="floating-form-group">
										<input type="email" class="floating-input" placeholder=" " name="email">
										<label class="floating-input-label" th:text="#{user.addUserModal.emailLabel}"></label>
									</div>
								</div>

								<div>
									<div class="floating-form-group">
										<select class="floating-select" id="userTypeSelect" name="userType">
											<option value="" selected disabled hidden></option>
											<option value="superadmin" th:text="#{user.addUserModal.superAdmin}"></option>
											<option value="stateadmin" th:text="#{user.addUserModal.adminState}"></option>
											<option value="ppdadmin" th:text="#{user.addUserModal.adminPpd}"></option>
											<option value="schooladmin" th:text="#{user.addUserModal.adminSchool}"></option>
										</select>
										<label class="floating-select-label" th:text="#{user.addUserModal.userTypeLabel}"></label>
									</div>

									<!-- Daerah Dropdown -->
									<div class="floating-form-group" id="daerahGroup" style="display: none;">
										<select class="floating-select"></select>
										<label class="floating-select-label" th:text="#{user.addUserModal.districtLabel}"></label>
									</div>

									<!-- Nama Sekola Dropdown -->
									<div class="floating-form-group" id="schoolGroup" style="display: none;">
										<select class="floating-select">
											<option value="" selected disabled hidden></option>
										</select>
										<label class="floating-select-label" th:text="#{user.addUserModal.schoolLabel}"></label>
									</div>

									<input	type="hidden" id="addUserDistrict" name="addUserDistrict" />
									<input	type="hidden" id="addUserSchoolCode" name="addUserSchoolCode"  />

								</div>

								<div class="d-flex justify-content-end mt-3"></div>
							</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-sm" data-bs-dismiss="modal" th:text="#{user.addUserModal.cancelButton}"></button>
						<button class="btn btn-primary btn-sm" type="submit" th:text="#{user.addUserModal.addUserButton}"></button>
					</div>

				</form>
			</div>

		</div>
	</div>
</div>
