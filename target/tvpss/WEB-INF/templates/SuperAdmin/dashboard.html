<div class="py-3 px-2">
	<div class="row gap-3">
		<div class="col card-dashboard">
			<div class="card-dashboard-content">
				<p>
					<i class="bi bi-person-gear" style="font-size: 64px"></i>
				</p>
				<p class="card-dashboard-number">5</p>
			</div>
			<p class="card-dashboard-title" th:text="#{dashboard.superadmin}"></p>
		</div>
		<div class="col card-dashboard">
			<div class="card-dashboard-content">
				<p>
					<i class="bi bi-person-vcard-fill" style="font-size: 64px"></i>
				</p>
				<p class="card-dashboard-number ps-3">5</p>
			</div>
			<p class="card-dashboard-title" th:text="#{dashboard.stateAdmin}"></p>
		</div>
		<div class="col card-dashboard">
			<div class="card-dashboard-content">
				<p>
					<i class="bi bi-person-square" style="font-size: 64px"></i>
				</p>
				<p class="card-dashboard-number ps-3">25</p>
			</div>
			<p class="card-dashboard-title" th:text="#{dashboard.ppdAdmin}"></p>
		</div>
		<div class="col card-dashboard">
			<div class="card-dashboard-content">
				<p>
					<i class="bi bi-person-workspace" style="font-size: 64px"></i>
				</p>
				<p class="card-dashboard-number ps-3">250</p>
			</div>
			<p class="card-dashboard-title" th:text="#{dashboard.schoolAdmin}"></p>
		</div>
	</div>
</div>

<div class="dashboard-graph">
	<div class="card-graph graph-1">
		<div>
			<p th:text="#{dashboard.userCountByType}"></p>
		</div>
		<div class="card-canvas">
			<canvas id="barChart"></canvas>
		</div>
	</div>

	<div class="card-graph graph-2">
		<div class="p-3">
			<p class="p-0 m-0" th:text="#{dashboard.userCountByDistrict}"></p>
			<hr>
			<div style="width: 200px;">
				<div class="floating-form-group">
					<select class="floating-select" value="">
						<option value="" selected disabled hidden></option>
						<option value="1" th:text="#{dashboard.district1}"></option>
					</select>
					<label class="floating-select-label" th:text="#{dashboard.selectDistrict}"></label>
				</div>
			</div>
			<hr>
		</div>
		<div class="canvas-graph">
			<canvas id="donutChart"></canvas>
		</div>
	</div>

	<div class="card-graph graph-3">
		<div>
			<p th:text="#{dashboard.userLog}"></p>
		</div>
		<div class="canvas-graph">
			<canvas id="lineChart"></canvas>
		</div>
	</div>
</div>

<th:block th:include="fragments/chartscripts :: chartscripts"></th:block>
