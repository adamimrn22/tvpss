<div
	th:replace="~{fragments/breadcrumbs :: breadcrumb3WithLink(
    title1=${breadcrumbTitle1}, 
    title2=${breadcrumbTitle2}, 
    title3=${breadcrumbTitle3},
    link1=${breadcrumbLink1}, 
)}">
</div>

<div class="card p-3">
	<div class="form-section row">

		<div class="col-12 col-md-6">
			<div class="floating-form-group">
				<input type="text" class="floating-input" id="schoolName" value="" readonly>
				<label class="floating-input-label" th:text="#{schooladmin.validateapplication.approved.kad_pengenalan_pelajar}">
					Kad Pengenalan Pelajar</label>
			</div>
		</div>

		<div class="col-12 col-md-6">
			<div class="floating-form-group">
				<input type="text" class="floating-input" id="address1" value="" readonly>
				<label class="floating-input-label" th:text="#{schooladmin.validateapplication.approved.nama_penuh_pelajar}">
					Nama Penuh Pelajar</label>
			</div>
		</div>

		<div class="col-12 col-md-6">
			<div class="floating-form-group">
				<input type="text" class="floating-input" id="address2" value="" readonly>
				<label class="floating-input-label" th:text="#{schooladmin.validateapplication.approved.alamat_email}">
					Alamat Email</label>
			</div>
		</div>

		<div class="col-12 col-md-6">
			<div class="floating-form-group">
				<input type="text" class="floating-input" id="postcode" value="" readonly>
				<label class="floating-input-label" th:text="#{schooladmin.validateapplication.approved.tarikh_permohonan}">
					Tarikh Permohonan</label>
			</div>
		</div>

		<div class="col-12 col-md-6">
			<div class="floating-form-group">
				<button class="floating-input btn-resume" type="button">
					<span th:text="#{schooladmin.validateapplication.approved.lihat_pautan_resume}">
						Lihat Pautan Resume</span>
				</button>
				<label class="floating-input-label" th:text="#{schooladmin.validateapplication.approved.pautan_resume}">
					Pautan Resume</label>
			</div>
		</div>

		<div class="col-12 col-md-6">
			<div class="floating-form-group">
				<button class="floating-input btn-resume" type="button">
					<span th:text="#{schooladmin.validateapplication.approved.lihat_pautan_media_sosial}">
						Lihat Pautan Media Sosial</span>
				</button>
				<label class="floating-input-label" th:text="#{schooladmin.validateapplication.approved.pautan_media_sosial}">
					Pautan Media Sosial</label>
			</div>
		</div>

		<div class="col-12">
			<div class="floating-form-group">
				<input type="text" class="floating-input" id="postcode" value="Lulus" readonly
					th:value="#{schooladmin.validateapplication.approved.status_permohonan_lulus}">
				<label class="floating-input-label" th:text="#{schooladmin.validateapplication.approved.status_permohonan}">
					Status Permohonan</label>
			</div>
		</div>

	</div>
</div>
