<div
	th:replace="~{fragments/breadcrumbs :: breadcrumb(title1=${breadcrumbTitle1}, title2=${breadcrumbTitle2})}">
</div>

<div class="card p-3">
	<h3 style="color: var(--primary)" th:text="#{schooladmin.schoolinfo.schoolInformation}"></h3>
	<form>
		<div class="form-section row">

			<!-- School Name -->
			<div class="col-12">
				<div class="floating-form-group">
					<input type="text" class="floating-input" id="schoolName" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.schoolName}"></label>
				</div>
			</div>

			<!-- Address 1, Address 2, Postcode, State -->
			<div class="col-12 col-md-6 col-lg-3">
				<div class="floating-form-group">
					<input type="text" class="floating-input" id="address1" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.address1}"></label>
				</div>
			</div>
			<div class="col-12 col-md-6 col-lg-3">
				<div class="floating-form-group">
					<input type="text" class="floating-input" id="address2" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.address2}"></label>
				</div>
			</div>
			<div class="col-12 col-md-6 col-lg-3">
				<div class="floating-form-group">
					<input type="text" class="floating-input" id="postcode" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.postcode}"></label>
				</div>
			</div>
			<div class="col-12 col-md-6 col-lg-3">
				<div class="floating-form-group">
					<input type="text" class="floating-input" id="state" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.state}"></label>
				</div>
			</div>

			<!-- Phone, Email, and Fax -->
			<div class="col-12 col-md-4">
				<div class="floating-form-group">
					<input type="text" class="floating-input" id="phone" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.phone}"></label>
				</div>
			</div>
			<div class="col-12 col-md-4">
				<div class="floating-form-group">
					<input type="email" class="floating-input" id="email" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.email}"></label>
				</div>
			</div>
			<div class="col-12 col-md-4">
				<div class="floating-form-group">
					<input type="text" class="floating-input" id="fax" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.fax}"></label>
				</div>
			</div>

			<!-- File Upload -->
			<div class="col-12">
				<div class="floating-form-group">
					<input type="file" class="floating-input" id="fileUpload" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.uploadLogo}"></label>
				</div>
			</div>

			<!-- YouTube Link -->
			<div class="col-12">
				<div class="floating-form-group">
					<input type="url" class="floating-input" id="youtubeLink" placeholder=" ">
					<label class="floating-input-label" th:text="#{schooladmin.schoolinfo.youtubeLink}"></label>
				</div>
			</div>

			<!-- Submit Button -->
			<div class="col-12 text-end mt-3">
				<button type="submit" class="btn btn-primary" th:text="#{schooladmin.schoolinfo.submitInformation}"></button>
			</div>

		</div>
	</form>
</div>
