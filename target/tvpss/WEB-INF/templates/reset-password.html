<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Kata Laluan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1rem;
    }

    .container {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      padding: 2.5rem;
    }

    h2 {
      text-align: center;
      font-weight: 600;
    }

    /* Custom message div styles */
    .message {
      margin-bottom: 1.5rem;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
    }

    .message-success {
      background-color: #d4edda;
      color: #155724;
      border-color: #c3e6cb;
    }

    .message-error {
      background-color: #f8d7da;
      color: #721c24;
      border-color: #f5c6cb;
    }

    .floating-form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .floating-input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #dee2e6;
      outline: none;
      transition: all 0.2s ease;
    }

    .floating-input:focus {
      border-color: #515B92;
      box-shadow: 0 0 0 2px rgba(81, 91, 146, 0.2);
    }

    .floating-input-label {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background-color: white;
      padding: 0 0.25rem;
      color: #6c757d;
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .floating-input:focus + .floating-input-label,
    .floating-input:not(:placeholder-shown) + .floating-input-label {
      top: 0;
      transform: translateY(-50%) scale(0.85);
      color: #515B92;
    }

    .btn {
      background-color: #515B92;
      color: white;
      padding: 0.75rem;
      border-radius: 0.5rem;
      width: 100%;
      font-weight: 500;
      border: none;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #424b7a;
    }

    .password-requirements {
      font-size: 0.9em;
      color: #666;
      text-align: center;
      margin-bottom: 2rem;
    }

    .password-requirements ul {
      padding-left: 20px;
    }

    .password-help {
      font-size: 0.875rem;
      color: #6c757d;
      text-align: center;
      margin-top: 1rem;
    }

    .password-help a {
      color: #515B92;
      text-decoration: none;
    }

    .password-help a:hover {
      text-decoration: underline;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .show-password-checkbox {
      font-size: 0.875rem;
      color: #6c757d;
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem; /* Added bottom margin for spacing */
    }

    .show-password-checkbox input[type="checkbox"] {
      accent-color: #515B92; /* Make the checkbox color match the primary color */
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Tetapan Semula Kata Laluan</h2>
  <div class="password-requirements">
    Kata laluan mesti sekurang-kurangnya 6 aksara panjang.
  </div>
  <!-- Error Message Display -->
  <div id="error-message" class="message message-error" style="display: none;">
    <span id="error-text"></span>
  </div>

  <!-- Success Message -->
  <div th:if="${success}" class="message message-success">
    <span th:text="${success}"></span>
  </div>

  <!-- Custom Error Message -->
  <div th:if="${message}" class="message message-error">
    <span th:text="${message}"></span>
  </div>

  <form th:action="@{/reset-password}" method="post">
    <input type="hidden" name="token" th:value="${token}"/>
    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />

    <!-- New Password Field -->
    <div class="floating-form-group">
      <input type="password"
             class="floating-input"
             id="password"
             name="password"
             placeholder=""
             required
             minlength="6"/>
      <label for="password" class="floating-input-label">Kata Laluan Baru</label>
    </div>

    <!-- Confirm Password Field -->
    <div class="floating-form-group">
      <input type="password"
             class="floating-input"
             id="confirmPassword"
             name="confirmPassword"
             placeholder=""
             required
             minlength="6"/>
      <label for="confirmPassword" class="floating-input-label">Sahkan Kata Laluan</label>
    </div>


    <!-- Show Password Checkbox -->
    <div class="show-password-checkbox">
      <input type="checkbox" id="show-password" />
      <label for="show-password" class="ms-2">Tunjuk Kata Laluan</label>
    </div>


    <button type="submit" class="btn">Tukar Kata Laluan</button>
  </form>

  <div class="password-help">
    Ingat kata laluan anda? <a th:href="@{/login}">Kembali ke Log Masuk</a>
  </div>
</div>

<script>
  document.querySelector('form').addEventListener('submit', function(e) {
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirmPassword').value;
    var errorMessageDiv = document.getElementById('error-message');
    var errorText = document.getElementById('error-text');

    // Clear previous error messages
    errorMessageDiv.style.display = 'none';

    if (password !== confirmPassword) {
      e.preventDefault();
      errorMessageDiv.style.display = 'block';
      errorText.textContent = 'Kata laluan tidak sepadan!';
      return false;
    }

    // Check for minimum length
    if (password.length < 6) {
      e.preventDefault();
      errorMessageDiv.style.display = 'block';
      errorText.textContent = 'Kata laluan mesti sekurang-kurangnya 6 aksara.';
      return false;
    }
  });

  // Toggle password visibility
  document.getElementById('show-password').addEventListener('change', function() {
    var passwordField = document.getElementById('password');
    var confirmPasswordField = document.getElementById('confirmPassword');

    if (this.checked) {
      passwordField.type = 'text';
      confirmPasswordField.type = 'text';
    } else {
      passwordField.type = 'password';
      confirmPasswordField.type = 'password';
    }
  });
</script>

</body>
</html>
