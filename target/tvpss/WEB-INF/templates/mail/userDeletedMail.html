<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TVPSS StarMis</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">
<table style="width: 100%;">
    <tr>
        <td style="padding: 30px; text-align: center; background-color: #515B92; color: #fff; border-top-left-radius: 8px; border-top-right-radius: 8px;">
            <h2 style="margin: 0; font-size: 24px;">TVPSS StarMis</h2>
            <p style="font-size: 18px; margin-top: 10px;">Selamat Sejahtera, <strong th:text="${name}">User</strong>,</p>
        </td>
    </tr>
    <tr style="background-color: #ffffff;">
        <td style="padding: 30px; font-size: 16px; color: #333;">
            <p style="margin-top: 0;">Akaun anda telah dipadam. Berikut adalah butiran akaun anda:</p>
            <div style="background-color: #f8f9fc; border-radius: 6px; padding: 20px; margin: 20px 0;">
                <table style="width: 100%;">
                    <tr>
                        <td style="padding: 12px; border-bottom: 1px solid #e1e4ee; color: #515B92; font-weight: bold;">Nama Pengguna:</td>
                        <td style="padding: 12px; border-bottom: 1px solid #e1e4ee;" th:text="${name}">Username</td>
                    </tr>
                    <tr>
                        <td style="padding: 12px; color: #515B92; font-weight: bold;">Alamat Email:</td>
                        <td style="padding: 12px; font-family: monospace;" th:text="${email}">email</td>
                    </tr>
                </table>
            </div>
            <div style="background-color: #fff4e5; border-left: 4px solid #ffa726; padding: 15px; margin: 20px 0; border-radius: 4px;">
                <p style="margin: 0; color: #955100;">
                    <strong>Penting:</strong> Untuk sebarang pertanyaan sila hubungi admin.
                </p>
            </div>
        </td>
    </tr>
</table>

<div style="margin-top: 20px; color: #666; font-size: 12px; text-align: center;">
    <p style="margin: 0;"><strong>Nota:</strong> Ini adalah e-mel yang dijana secara automatik. Sila jangan balas kepada e-mel ini.</p>
</div>

</body>
</html>
