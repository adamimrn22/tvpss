<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TVPSS StarMis - Tetap Semula Kata Laluan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    .email-container {
      background-color: #ffffff;
    }
    .header {
      background-color: #515B92;
      color: #ffffff;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .content {
      padding: 20px;
      color: #333333;
      line-height: 1.6;
      text-align: center;
    }
    .content p {
      margin: 10px 0;
    }
    .button-container {
      text-align: center;
      margin: 20px 0;
    }
    .reset-button {
      display: inline-block;
      background-color: #515B92;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
    }
    .reset-button:hover {
      background-color: #485085;
    }
    .footer {
      background-color: #f1f1f1;
      padding: 10px 20px;
      text-align: center;
      font-size: 12px;
      color: #777777;
    }
  </style>
</head>
<body>
<div class="email-container">
  <div class="header">
    TVPSS StarMis
  </div>
  <div class="content">
    <h1>Tetap Semula Kata Laluan</h1>
    <p>Kami menerima permintaan untuk menetapkan semula kata laluan anda untuk akaun anda.</p>
    <div class="button-container">
      <a th:href="${resetLink}" class="reset-button">TETAP SEMULA KATA LALUAN</a>
    </div>
    <p>Jika anda tidak meminta tetapan semula kata laluan, sila abaikan e-mel ini.</p>
  </div>
  <div class="footer">
    © 2025 TV Pusat Sumber Sekolah. All rights reserved.
  </div>
</div>
</body>
</html>
