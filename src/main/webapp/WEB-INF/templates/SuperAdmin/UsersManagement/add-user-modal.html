
<!-- Add User Modal -->
<div th:fragment="addUserModal">
	<div class="modal fade" id="addUserModal" tabindex="-1"
		aria-labelledby="addUserModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="addUserModalLabel"
						style="color: #515B92">Tambah Pengguna Baharu</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form action="/StarMIS_TVPSS/SuperAdmin/Pengguna/TambahPengguna"
						method="post">
						<div class="p-3 pt-0">
							<div>
								<!-- Set the width here -->
								<div class="floating-form-group">
									<input type="text" class="floating-input" placeholder=" ">
									<label class="floating-input-label">Nama Penuh Pengguna</label>
								</div>
							</div>
							<div>
								<!-- Set the width here -->
								<div class="floating-form-group">
									<input type="text" class="floating-input" placeholder=" ">
									<label class="floating-input-label">Email Penuh
										Pengguna</label>
								</div>
							</div>

							<div>
								<div class="floating-form-group">
									<select class="floating-select" id="userTypeSelect">
										<option value="" selected disabled hidden></option>
										<option value="super-admin">Super Admin</option>
										<option value="admin-state">Admin State</option>
										<option value="admin-ppd">Admin PPD</option>
										<option value="admin-school">Admin School</option>
									</select> <label class="floating-select-label">Jenis Pengguna</label>
								</div>

								<!-- Daerah Dropdown -->
								<div class="floating-form-group" id="daerahGroup"
									style="display: none;">
									<select class="floating-select">
										<option value="" selected disabled hidden></option>
										<option value="skudai">Skudai</option>
										<option value="kulai">Kulai</option>
										<option value="pontian">Pontian</option>
										<option value="batu-pahat">Batu Pahat</option>
									</select> <label class="floating-select-label">Daerah</label>
								</div>

								<!-- Nama Sekola Dropdown -->
								<div class="floating-form-group" id="schoolGroup"
									style="display: none;">
									<select class="floating-select">
										<option value="" selected disabled hidden></option>
										<option value="smk-skudai">SMK Skudai</option>
										<option value="smk-kulai">SMK Kulai</option>
										<option value="smk-pontian">SMK Pontian</option>
										<option value="smk-batu-pahat">SMK Batu Pahat</option>
									</select> <label class="floating-select-label">Nama Sekolah</label>
								</div>

							</div>

							<div class="d-flex justify-content-end mt-3"></div>
						</div>
					</form>


				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-sm" data-bs-dismiss="modal">Batal</button>
					<button class="btn btn-primary btn-sm" type="submit">Tambah Pengguna</button>
				</div>
			</div>
		</div>
	</div>
</div>
