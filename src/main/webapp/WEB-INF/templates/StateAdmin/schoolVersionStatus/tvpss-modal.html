<div th:fragment="tvpssinfomodal">

	<div class="modal fade" id="modalLogoTVPSS" tabindex="-1"
		aria-labelledby="modalLogoTVPSSLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="modalLogoTVPSSLabel">Logo TVPSS</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<img src="logo_image.jpg" class="img-fluid" alt="Logo TVPSS">
				</div>
			</div>
		</div>
	</div>

	<!-- Modal for Corner/Mini/TV Studio -->
	<div class="modal fade" id="modalStudio" tabindex="-1"
		aria-labelledby="modalStudioLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="modalStudioLabel">Corner/Mini/TV
						Studio</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<img src="studio_image.jpg" class="img-fluid" alt="Studio">
				</div>
			</div>
		</div>
	</div>

	<!-- Modal for YouTube Upload -->
	<div class="modal fade" id="modalYoutube" tabindex="-1"
		aria-labelledby="modalYoutubeLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="modalYoutubeLabel">YouTube Upload</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<img src="youtube_upload_image.jpg" class="img-fluid"
						alt="YouTube Upload">
				</div>
			</div>
		</div>
	</div>

	<!-- Modal for Rakaman Dalam Sekolah -->
	<div class="modal fade" id="modalRakaman" tabindex="-1"
		aria-labelledby="modalRakamanLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="modalRakamanLabel">Rakaman Dalam
						Sekolah</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<img src="rakaman_image.jpg" class="img-fluid"
						alt="Rakaman Dalam Sekolah">
				</div>
			</div>
		</div>
	</div>

	<!-- Modal for Berkolaborasi Syarikat Luar -->
	<div class="modal fade" id="modalCollaboration" tabindex="-1"
		aria-labelledby="modalCollaborationLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="modalCollaborationLabel">Berkolaborasi
						Syarikat Luar</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<img src="collaboration_image.jpg" class="img-fluid"
						alt="Berkolaborasi Syarikat Luar">
				</div>
			</div>
		</div>
	</div>

	<!-- Modal for Penggunaan Teknologi Green Screen -->
	<div class="modal fade" id="modalGreenScreen" tabindex="-1"
		aria-labelledby="modalGreenScreenLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="modalGreenScreenLabel">Penggunaan
						Teknologi Green Screen</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<img src="green_screen_image.jpg" class="img-fluid"
						alt="Green Screen">
				</div>
			</div>
		</div>
	</div>

</div>
