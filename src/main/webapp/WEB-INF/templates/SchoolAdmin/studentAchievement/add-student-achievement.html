<div class="p-3 pb-0">
	<div th:replace="~{fragments/breadcrumbs :: breadcrumb(title1=${breadcrumbTitle1}, title2=${breadcrumbTitle2})}"></div>
</div>

<div class="p-3">
	<!-- Main Form -->
	<form id="studentForm" th:action="@{/student/achievement/save}" method="POST">
		<div class="card">
			<div class="card-header d-flex justify-content-between align-items-center">
				<h5 class="mb-0">Student List</h5>
				<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#searchModal">Add Student</button>
			</div>
			<div class="card-body">
				<table class="table" id="selectedStudentsTable">
					<thead>
					<tr>
						<th style="width: 10%">ID</th>
						<th style="width: 20%">Name</th>
						<th style="width: 15%">Date</th>
						<th style="width: 20%">Jenis Pencapaian</th>
						<th style="width: 25%">Maklumat Pencapaian</th>
						<th style="width: 10%">Action</th>
					</tr>
					</thead>
					<tbody>
					<!-- Selected students will appear here -->
					</tbody>
				</table>

				<div class="d-flex justify-content-between align-items-center">
					<div class="pagination-info">
						Showing <span id="mainStartIndex">0</span> to <span id="mainEndIndex">0</span> of <span id="mainTotalItems">0</span> entries
					</div>
					<ul class="pagination" id="mainPagination">
						<!-- Main pagination will be generated here -->
					</ul>
				</div>
				<button type="submit" class="btn btn-primary mt-3">Submit Form</button>
			</div>
		</div>
	</form>

	<!-- Search Modal -->
	<div class="modal fade" id="searchModal" tabindex="-1">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Search Students</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<div class="row mb-3">
						<div class="col-md-8">
							<input type="text" class="form-control" id="searchInput" placeholder="Search students...">
						</div>
						<div class="col-md-4">
							<input type="date" class="form-control" id="modalDate">
						</div>
					</div>
					<table class="table" id="searchResultsTable">
						<thead>
						<tr>
							<th style="width: 15%">ID</th>
							<th style="width: 65%">Name</th>
							<th style="width: 20%">Action</th>
						</tr>
						</thead>
						<tbody>
						<!-- Search results will appear here -->
						</tbody>
					</table>
					<div class="d-flex justify-content-between align-items-center">
						<div class="pagination-info">
							Showing <span id="modalStartIndex">0</span> to <span id="modalEndIndex">0</span> of <span id="modalTotalItems">0</span> entries
						</div>
						<ul class="pagination" id="modalPagination">
							<!-- Modal pagination will be generated here -->
						</ul>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script th:inline="javascript">
	const schoolCode = /*[[${schoolCode}]]*/ '';
	const contextPath = /*[[@{/}]]*/ '';
</script>

<script th:src="@{/js/SchoolAdmin/addStudentAchievement.js}"></script>
